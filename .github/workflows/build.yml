name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build app
        run: ./build-app.sh

      - name: Package app
        run: ditto -c -k --keepParent build/AKeyboardSwitcher.app build/AKeyboardSwitcher.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AKeyboardSwitcher
          path: build/AKeyboardSwitcher.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/AKeyboardSwitcher.zip --title "$GITHUB_REF_NAME" --generate-notes
